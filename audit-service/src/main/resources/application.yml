spring:
  application:
    name: audit-service

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: audit-service

observability:
  logging:
    endpoint: http://localhost:8090/api/v1/logs

  audit:
    endpoint: http://localhost:8081/api/v1/audit

bank:
  code: NPST
  name: NPST Bank
  environment: UAT
  region: IN